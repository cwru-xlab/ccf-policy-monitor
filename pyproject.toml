[project]
name = "policy-radar"
version = "0.2.0"
description = "Guideline ingestion and CPB parsing backend for payer policy review"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "fastapi>=0.115",
    "instructor>=1.7",
    "httpx>=0.27",
    "pgvector>=0.3",
    "pymupdf>=1.24,<2",
    "pymupdf4llm>=0.0.17,<0.2",
    "python-docx>=1.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["policy_radar", "policy_radar.responses"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: makes real requests to provider APIs (pytest -m live)"]

[tool.ruff]
line-length = 100
